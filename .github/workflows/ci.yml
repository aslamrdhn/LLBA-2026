name: CI Verification Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Gate 5 - Prisma Validate
        run: npx prisma validate

      - name: Gate 1 - Typecheck
        run: npm run typecheck

      - name: Gate 2 - Lint
        run: npm run lint

      - name: Gate 3 - Tests
        run: npm test

      - name: Gate 4 - Build
        run: npm run build
